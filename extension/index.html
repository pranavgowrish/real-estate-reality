<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>extension</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 700px;
        min-width: 700px;
        max-width: 700px;
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
      }

      #background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        opacity: 1;
      }

      #root {
        position: relative;
        z-index: 1;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <video id="background-video" autoplay muted loop playsinline>
      <source src="/src/assets/bg.mp4" type="video/mp4">
    </video>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
